<!DOCTYPE html>
<html>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <head>
    <title>
      ESP32 Device Manager 
    </title>
    <link rel="icon" href="data:,"> 
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-indigo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
      .body {
        position: relative;
        display: flex;
        flex-flow: column;
        height: 100%;
      }
      .content-body {
        flex-grow: 1;
      }

      a {
        text-decoration:none
      }

      .w3-overlay {
        cursor: pointer;
        position: absolute;
      }
      .w3-sidebar {
        display: none;
        z-index: 3;
      }
      .chip {
        width: 80%;
      }
      .chip-info {
        padding-bottom: 0px !important;
        padding-top: 0px !important;
      }
    </style>
  </head>
  <body">
      <!-- Sidebar -->
      <div class="w3-sidebar w3-bar-block w3-border-right" id="sideMenu">
        <a href="#" class="w3-bar-item w3-large w3-right" onclick="sbClose()" style="text-align:right;">&times;</a>
        <a href="#" class="w3-bar-item w3-button w3-border-bottom" onclick="sbClose();callHome();"><i class="fa fa-home"></i>&nbsp;&nbsp;home</a>
        <a href="#" class="w3-bar-item w3-button w3-border-bottom" onclick="sbClose();callSettings();"><i class="fa fa-cog"></i>&nbsp;&nbsp;settings</a>
        <a href="#" class="w3-bar-item w3-button w3-border-bottom" onclick="sbClose();callGpio();">&nbsp;&nbsp;&nbsp;&nbsp;gpio</a>
        <a href="#" class="w3-bar-item w3-button w3-border-bottom" onclick="sbClose();callGps();">&nbsp;&nbsp;&nbsp;&nbsp;gps</a>
        <a href="#" class="w3-bar-item w3-button w3-border-bottom" onclick="sbClose();callThermistor();">&nbsp;&nbsp;&nbsp;&nbsp;thermistor</a>
        <a href="#" class="w3-bar-item w3-button w3-border-bottom" onclick="sbClose();callHumidity();">&nbsp;&nbsp;&nbsp;&nbsp;humidity</a>
        <a href="#" class="w3-bar-item w3-button w3-border-bottom" onclick="sbClose();callProximity();">&nbsp;&nbsp;&nbsp;&nbsp;proximity</a>
      </div>
      <!-- Page Content -->
      <div id="mainBody">
       <div class="w3-overlay w3-animate-opacity" onclick="sbClose()" id="idOverlay">
        <i class="fa fa-refresh w3-xxxlarge w3-spin" id="idSpinner" 
          style="position:fixed;top:30%;left:45%;-webkit-transform:translate(-50%, -50%);
            transform:translate(-50%,-50%);display:none;"></i>
       </div>
        <!-- header -->
        <div class="w3-bar w3-theme w3-xlarge" id="headerBar">
          <a id="navOpen" class="w3-bar-item w3-button" href="#" onclick="sbOpen()"><i class="fa fa-bars"></i></a>
          <span class="w3-bar-item">esp32 device control</span>
        </div>
        <!-- body -->
        <div class="w3-container content-body" id="appView"></div>
      </div>
    <script>
      const progressModal = {
        start: () => {
          idOverlay.style.display = "block";
          idSpinner.style.display = "block";
        },
        stop: () => {
          idOverlay.style.display = "none";
          idSpinner.style.display = "none";
        }
      }
      const sbOpen = () => {
        sideMenu.style.display = "block";
        navOpen.style.display = "none";
        idOverlay.style.display = "block";
      }
      const sbClose = () => {
        sideMenu.style.display = "none";
        navOpen.style.display = "inline-block";
        idOverlay.style.display = "none";
      }
    </script>
  </body>

  <script type="text/javascript" src="./main.js"></script>

</html>
